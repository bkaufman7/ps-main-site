<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTM Container Audit • Platform Solutions</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --ring-strong: rgba(11,11,11,0.18);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --good: #0ca30c; --good-ink: #006300; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --low: #898781; --info: #c3c2b7; --accent: #2a78d6; --accent-wash: rgba(42,120,214,0.10);
  --add-wash: rgba(12,163,12,0.10); --rem-wash: rgba(208,59,59,0.10);
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --ring-strong: rgba(255,255,255,0.18);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --good-ink: #0ca30c; --low: #898781; --info: #5d5c57; --accent: #3987e5; --accent-wash: rgba(57,135,229,0.16);
    --add-wash: rgba(12,163,12,0.16); --rem-wash: rgba(208,59,59,0.18);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --ring-strong: rgba(255,255,255,0.18);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --good-ink: #0ca30c; --low: #898781; --info: #5d5c57; --accent: #3987e5; --accent-wash: rgba(57,135,229,0.16);
  --add-wash: rgba(12,163,12,0.16); --rem-wash: rgba(208,59,59,0.18);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 0 0 4px; }
h3 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
p { margin: 0 0 10px; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .tiny { font-size: 11.5px; } .b { font-weight: 600; }
.mono { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.num { font-variant-numeric: tabular-nums; text-align: right; }
.row { display: flex; align-items: center; } .gap { gap: 8px; } .wrap { flex-wrap: wrap; } .center { justify-content: center; }
.pad { padding: 8px 4px; }

/* header */
header.top { position: sticky; top: 0; z-index: 20; background: var(--page); border-bottom: 1px solid var(--ring); }
.topin { max-width: 1320px; margin: 0 auto; padding: 10px 20px 0; }
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.logo i { padding: 0 5px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-grid; place-items: center; color: #fff; font-style: normal; font-size: 12px; }
#ctx { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; flex: 1; min-width: 0; }
.ctx-name { font-weight: 600; margin-left: 6px; }
.hdr-actions { display: flex; gap: 6px; margin-left: auto; align-items: center; }
.hdr-actions a.btn { text-decoration: none; }
nav.tabs { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; }
body:not(.loaded) nav.tabs [data-tab=issues], body:not(.loaded) nav.tabs [data-tab=explorer], body:not(.loaded) nav.tabs [data-tab=map], body:not(.loaded) nav.tabs [data-tab=compare] { display: none; }
nav.tabs button { background: none; border: 0; padding: 9px 12px; border-bottom: 2px solid transparent; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs .badge { font-size: 11px; background: var(--surface-2); border-radius: 10px; padding: 1px 6px; margin-left: 4px; font-variant-numeric: tabular-nums; }
nav.tabs .badge:empty { display: none; }

main { max-width: 1320px; margin: 0 auto; padding: 18px 20px 60px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.narrow { max-width: 820px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 2px; }
.big { font-size: 18px; font-weight: 650; }

/* buttons, inputs */
.btn { border: 1px solid var(--ring-strong); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
input[type=search], select { border: 1px solid var(--ring-strong); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input[type=search] { width: 260px; max-width: 100%; }
.check { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.pill { font-size: 12px; border: 1px solid var(--ring-strong); border-radius: 999px; padding: 1px 8px; color: var(--ink-2); white-space: nowrap; }
.pill.alt { border-color: var(--accent); color: var(--accent); }
.pill.warn { border-color: var(--warning); }
.pill.ok { border-color: var(--good); }

/* hero / drop */
.hero { max-width: 760px; margin: 6vh auto 0; text-align: center; display: flex; flex-direction: column; gap: 14px; }
.lead { color: var(--ink-2); font-size: 15.5px; }
.drop { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 42px 20px; border: 2px dashed var(--axis); border-radius: 16px; background: var(--surface); cursor: pointer; color: var(--ink-2); transition: border-color .15s, background .15s; }
.drop:hover { border-color: var(--accent); background: var(--accent-wash); }
.drop-title { font-size: 17px; font-weight: 600; color: var(--ink); }
.privacy { font-size: 13px; color: var(--ink-2); }
.dropveil { position: fixed; inset: 0; background: color-mix(in srgb, var(--page) 80%, transparent); display: none; place-items: center; z-index: 50; pointer-events: none; }
.dropveil div { border: 3px dashed var(--accent); border-radius: 20px; padding: 50px 70px; font-size: 20px; font-weight: 600; background: var(--surface); }
body.dragging .dropveil { display: grid; }

/* meta + tiles */
.meta { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
@media (max-width: 700px) { .meta { grid-template-columns: 1fr; } }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.tile.clickable { cursor: pointer; } .tile.clickable:hover { border-color: var(--ring-strong); }
.tl { font-size: 12.5px; color: var(--ink-2); }
.tv { font-size: 30px; font-weight: 650; line-height: 1.1; }
.tv .of { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 2px; }
.sevrow { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; }
.deltas { display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
.d-add { color: var(--good-ink); } .d-rem { color: var(--critical); } .d-chg { color: var(--ink-2); }

/* severity + status */
.sev { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink); white-space: nowrap; }
.sev .glyph { width: 16px; height: 16px; border-radius: 4px; display: inline-grid; place-items: center; font-size: 9px; color: #fff; font-style: normal; font-weight: 700; }
.sev-critical .glyph { background: var(--critical); } .sev-high .glyph { background: var(--serious); } .sev-medium .glyph { background: var(--warning); color: #0b0b0b; }
.sev-low .glyph { background: var(--low); } .sev-info .glyph { background: var(--info); color: var(--ink); font-family: Georgia, serif; font-style: italic; font-size: 11px; }
.sev.compact { font-variant-numeric: tabular-nums; }
.sevfill-critical { background: var(--critical); } .sevfill-high { background: var(--serious); } .sevfill-medium { background: var(--warning); } .sevfill-low { background: var(--low); } .sevfill-info { background: var(--info); }
.sevborder-critical { border-left: 4px solid var(--critical); } .sevborder-high { border-left: 4px solid var(--serious); } .sevborder-medium { border-left: 4px solid var(--warning); } .sevborder-low { border-left: 4px solid var(--low); } .sevborder-info { border-left: 4px solid var(--info); }
.status { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; }
.status .glyph { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 11px; }
.st-good .glyph { background: var(--good); } .st-warning .glyph { background: var(--warning); color: #0b0b0b; } .st-critical .glyph { background: var(--critical); }

/* charts */
.hbar { display: flex; flex-direction: column; gap: 4px; }
.hrow { display: grid; grid-template-columns: minmax(110px, 38%) 1fr 36px; align-items: center; gap: 10px; padding: 3px 4px; border-radius: 6px; }
.hrow:hover { background: var(--surface-2); }
.hrow.clickable { cursor: pointer; }
.hl { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.htrack { height: 14px; border-left: 1px solid var(--axis); }
.hfill { height: 14px; background: var(--s1); border-radius: 0 4px 4px 0; }
.hv { font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
.stack { display: flex; gap: 2px; height: 14px; }
.stack .seg:last-child { border-radius: 0 4px 4px 0; }
.segbar { display: flex; gap: 2px; height: 22px; margin: 6px 0 10px; }
.segbar .seg:first-child { border-radius: 4px 0 0 4px; } .segbar .seg:last-child { border-radius: 0 4px 4px 0; }
.cat-s1 { background: var(--s1); } .cat-s2 { background: var(--s2); } .cat-s3 { background: var(--s3); } .cat-s4 { background: var(--s4); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
.legend.col { flex-direction: column; gap: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.sw.paused { background: var(--surface-2); border: 1px dashed var(--muted); }
.sw.bad { background: var(--surface); border: 2px solid var(--critical); }
.ln { width: 18px; height: 0; border-top: 2px solid var(--s1); display: inline-block; }
.ln.block { border-top: 2px dashed var(--critical); } .ln.var { border-top-color: var(--muted); }
details.tbl { margin-top: 10px; } details.tbl summary { font-size: 12.5px; color: var(--muted); cursor: pointer; }

/* tables */
.tablewrap { overflow: auto; }
.tablewrap.tall { max-height: 70vh; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
thead th { font-size: 12px; color: var(--ink-2); font-weight: 600; position: sticky; top: 0; background: var(--surface); z-index: 1; }
table.inv td.mono { word-break: normal; overflow-wrap: anywhere; min-width: 150px; }
table.inv th[colspan] { background: var(--surface-2); font-size: 12px; color: var(--ink-2); }
table.kv th { width: 34%; color: var(--ink-2); font-weight: 500; word-break: break-word; }
table.list tr.pick { cursor: pointer; }
table.list tr.pick:hover td { background: var(--surface-2); }
table.list tr.sel td { background: var(--accent-wash); }
pre.code { margin: 0; padding: 10px; background: var(--surface-2); border-radius: 8px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow: auto; }
mark.vref { background: var(--accent-wash); color: var(--accent); border-radius: 3px; padding: 0 2px; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; border: 1px solid var(--ring-strong); background: var(--surface); border-radius: 7px; padding: 3px 8px; font-size: 12.5px; margin: 2px 4px 2px 0; text-align: left; }
.chip.ent { cursor: pointer; } .chip.ent:hover { border-color: var(--accent); background: var(--accent-wash); }
.chip .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.chip.bad { border-color: var(--critical); color: var(--critical); }

/* issues */
.toolbar { display: flex; flex-direction: column; gap: 10px; }
.toggle { border: 1px solid var(--ring-strong); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; opacity: .55; }
.toggle.on { opacity: 1; background: var(--surface-2); }
details.issue { padding: 0; }
details.issue > summary { list-style: none; display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; padding: 12px 16px; cursor: pointer; }
details.issue > summary::-webkit-details-marker { display: none; }
.it { font-weight: 600; }
.count { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ib { padding: 0 16px 14px; }
ul.ents { list-style: none; padding: 0; margin: 6px 0 10px; display: flex; flex-direction: column; gap: 2px; }
.fix { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
ul.toplist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
ul.toplist li { display: grid; grid-template-columns: 92px 1fr; gap: 8px; align-items: start; }
@media (max-width: 640px) { details.issue > summary { grid-template-columns: auto 1fr; } }

/* explorer */
.explorer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .explorer { grid-template-columns: 1fr; } }
.detailpane { position: sticky; top: 108px; max-height: calc(100vh - 124px); overflow: auto; }
@media (max-width: 980px) { .detailpane { position: static; max-height: none; } }
.seg-ctl { display: flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 3px; margin-bottom: 10px; }
.seg-ctl button { flex: 1; border: 0; background: transparent; padding: 6px; border-radius: 7px; cursor: pointer; }
.seg-ctl button.on { background: var(--surface); box-shadow: 0 0 0 1px var(--ring); font-weight: 600; }
.filters { margin-bottom: 6px; }
.empty-detail { text-align: center; padding: 50px 20px; }
.dh { margin-bottom: 12px; } .dh h2 { font-size: 19px; margin: 2px 0 8px; word-break: break-word; }
.dsec { border-top: 1px solid var(--grid); padding: 12px 0; }
.mini { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; display: flex; flex-direction: column; gap: 3px; }
.flow { display: grid; grid-template-columns: 1fr 20px 1fr 20px 1fr; gap: 8px; align-items: center; }
.flowcol { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
.flowcol.center { align-items: stretch; }
.node { border: 2px solid var(--accent); border-radius: 10px; padding: 10px; font-weight: 600; text-align: center; word-break: break-word; background: var(--accent-wash); margin-bottom: 6px; }
.arrow { color: var(--muted); font-size: 18px; text-align: center; }
@media (max-width: 640px) { .flow { grid-template-columns: 1fr; } .arrow { transform: rotate(90deg); } }
.flowmeta { margin-top: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
ul.conds { margin: 0 0 6px; padding-left: 18px; }
details.raw summary { cursor: pointer; color: var(--ink-2); font-size: 13px; margin-bottom: 8px; }

/* map */
.mapwrap { overflow: auto; max-height: 78vh; border-top: 1px solid var(--grid); margin-top: 10px; }
svg.map { display: block; min-width: 860px; font-family: var(--font); }
svg.map .colh { font-size: 12px; font-weight: 600; fill: var(--ink-2); }
svg.map .nd rect { fill: var(--surface); stroke: var(--ring-strong); }
svg.map .nd text { font-size: 12px; fill: var(--ink); pointer-events: none; }
svg.map .nd text.sub { font-size: 10.5px; fill: var(--muted); }
svg.map .nd[data-go] { cursor: pointer; }
svg.map .n-tag rect { stroke: var(--accent); }
svg.map .n-tag.paused rect { stroke-dasharray: 4 3; stroke: var(--muted); fill: var(--surface-2); }
svg.map .n-tag.paused text { fill: var(--muted); }
svg.map .builtin rect { fill: var(--surface-2); }
svg.map .missing rect, svg.map .bad rect { stroke: var(--critical); stroke-width: 2; }
svg.map .nd:hover rect { fill: var(--accent-wash); }
svg.map .ed { fill: none; stroke-width: 1.4; opacity: .45; }
svg.map .e-fire { stroke: var(--s1); }
svg.map .e-block { stroke: var(--critical); stroke-dasharray: 5 4; opacity: .8; }
svg.map .e-var { stroke: var(--muted); opacity: .3; }
svg.map.focus .nd { opacity: .25; } svg.map.focus .nd.hl { opacity: 1; }
svg.map.focus .ed { opacity: .05; } svg.map.focus .ed.hl { opacity: 1; stroke-width: 2.2; }

/* compare */
.summary { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
.warnbox { border: 1px solid var(--warning); background: color-mix(in srgb, var(--warning) 12%, transparent); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
details.chg { border-top: 1px solid var(--grid); padding: 8px 0; }
details.chg summary { cursor: pointer; }
table.diff td.was { background: var(--rem-wash); } table.diff td.now { background: var(--add-wash); }
table.diff th { width: 22%; }
.linediff .ld { display: block; }
.linediff .lda { background: var(--add-wash); } .linediff .ldr { background: var(--rem-wash); } .linediff .ldc { color: var(--muted); }

/* help */
ol.steps { padding-left: 20px; display: flex; flex-direction: column; gap: 6px; margin: 8px 0 16px; }
ul.plain { padding-left: 18px; display: flex; flex-direction: column; gap: 6px; margin: 8px 0 14px; }


/* scope + checklist */
.scope-row { display: grid; grid-template-columns: 90px 1fr; gap: 10px; align-items: center; margin: 8px 0; }
@media (max-width: 640px) { .scope-row { grid-template-columns: 1fr; } }
details.scope-pick { border-top: 1px solid var(--grid); margin-top: 10px; padding-top: 10px; }
details.scope-pick summary { cursor: pointer; font-weight: 600; font-size: 13.5px; }
.pickgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; margin: 12px 0; }
@media (max-width: 800px) { .pickgrid { grid-template-columns: 1fr; } }
label.pick { display: flex; align-items: flex-start; gap: 8px; padding: 3px 0; color: var(--ink); font-size: 13px; }
label.pick input { margin-top: 3px; }
button.pill { background: none; cursor: pointer; font: inherit; font-size: 12px; }
.cathead { display: flex; align-items: baseline; gap: 12px; margin: 10px 2px 0; }
.crow { display: grid; grid-template-columns: 96px 1fr auto; gap: 12px; align-items: center; padding: 9px 16px; }
.crow.na { opacity: .7; }
.cstat { font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.cstat.pass { color: var(--good-ink); }
.cstat.pass .glyph { width: 16px; height: 16px; border-radius: 50%; background: var(--good); color: #fff; display: inline-grid; place-items: center; font-size: 10px; }
.cstat.na { color: var(--muted); }
.plats { display: inline-flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.ptag { font-size: 11px; color: var(--ink-2); background: var(--surface-2); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
details.issue > summary { grid-template-columns: auto 1fr auto auto; }
details.outscope summary { cursor: pointer; color: var(--ink-2); }
#issueList { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 640px) { .crow { grid-template-columns: 1fr; } .plats { justify-content: flex-start; } }

.loaded-only { display: none; } body.loaded .loaded-only { display: inline-block; }
.reportbar { background: var(--accent-wash); border-bottom: 1px solid var(--ring); font-size: 13px; }
.reportbar .topin { padding: 7px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
/* drive library */
table.lib td { vertical-align: middle; }
table.lib tr.grow.open td { background: var(--surface-2); }
table.lib td.acts { white-space: nowrap; text-align: right; }

.linkbtn { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: var(--ink); font-size: 14px; }
.linkbtn:hover { color: var(--accent); }
tr.vrow > td { padding: 0 0 12px 18px; background: var(--surface-2); }
.vbox { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 10px; }
.vbar { justify-content: space-between; margin-bottom: 6px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.libform { display: flex; flex-direction: column; gap: 12px; margin: 12px 0; }
.libform label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); }
.libform input { border: 1px solid var(--ring-strong); background: var(--surface); border-radius: 8px; padding: 8px 10px; }
.libstatus { display: flex; gap: 10px; align-items: center; padding: 10px 0; color: var(--ink-2); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--grid); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* overlays */
#tt { position: fixed; z-index: 60; background: var(--surface); color: var(--ink); border: 1px solid var(--ring-strong); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; max-width: 340px; box-shadow: 0 6px 24px rgba(0,0,0,.14); pointer-events: none; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 10px; z-index: 70; transition: .2s; max-width: 90vw; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--critical); color: #fff; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: center; z-index: 80; padding: 20px; }
.modal[hidden] { display: none; }
.modal-card { background: var(--surface); border-radius: 14px; padding: 20px; max-width: 620px; width: 100%; border: 1px solid var(--ring); }
.copybox { width: 100%; height: 300px; font: 12px/1.5 var(--mono); margin: 8px 0 12px; background: var(--surface-2); border: 1px solid var(--ring); border-radius: 8px; padding: 8px; }
</style>

<header class="top"><div class="topin">

<div id="modal" class="modal" hidden><div class="modal-card" id="modalBody" role="dialog" aria-modal="true"></div></div>
<script>/* ===== GTM audit core: parsing, rules, diff. No DOM access. ===== */
var GTMCore = (function () {
  'use strict';

  var BUILTIN_TRIGGERS = {
    '2147479553': 'All Pages',
    '2147479572': 'Consent Initialization - All Pages',
    '2147479573': 'Initialization - All Pages'
  };
  var ALL_PAGES = '2147479553', CONSENT_INIT = '2147479572';

  var TAG_TYPES = {
    html: 'Custom HTML', img: 'Custom Image', googtag: 'Google Tag', gaawc: 'GA4 Configuration (legacy)',
    gaawe: 'GA4 Event', ua: 'Universal Analytics (sunset)', awct: 'Google Ads Conversion Tracking',
    sp: 'Google Ads Remarketing', gclidw: 'Conversion Linker', flc: 'Floodlight Counter', fls: 'Floodlight Sales',
    awud: 'Google Ads User-Provided Data Event', baut: 'Microsoft Advertising UET', bzi: 'LinkedIn Insight',
    hjtc: 'Hotjar Tracking Code', pntr: 'Pinterest Tag', twitter_website_tag: 'Twitter/X Base Pixel',
    cegg: 'Crazy Egg', qcm: 'Quantcast Measure', ga: 'Classic Google Analytics (sunset)', opt: 'Google Optimize (sunset)',
    awcc: 'Google Ads Calls from Website Conversion', cloudflare: 'Cloudflare Zaraz'
  };
  var GOOGLE_TAGS = { googtag: 1, gaawc: 1, gaawe: 1, ua: 1, awct: 1, sp: 1, gclidw: 1, flc: 1, fls: 1, awud: 1, awcc: 1, ga: 1, opt: 1 };
  var CONVERSION_TAGS = { awct: 1, fls: 1, flc: 1, awud: 1 };
  var EC_OK_TAGS = { awct: 1, awud: 1, googtag: 1, gaawc: 1, flc: 1, fls: 1 };

  var TRIGGER_TYPES = {
    pageview: 'Page View', domReady: 'DOM Ready', windowLoaded: 'Window Loaded', customEvent: 'Custom Event',
    click: 'Click - All Elements', linkClick: 'Click - Just Links', formSubmission: 'Form Submission',
    historyChange: 'History Change', jsError: 'JavaScript Error', timer: 'Timer', scrollDepth: 'Scroll Depth',
    youTubeVideo: 'YouTube Video', elementVisibility: 'Element Visibility', triggerGroup: 'Trigger Group',
    init: 'Initialization', consentInit: 'Consent Initialization', always: 'Always'
  };
  var VAR_TYPES = {
    v: 'Data Layer Variable', c: 'Constant', jsm: 'Custom JavaScript', j: 'JavaScript Variable', k: '1st-Party Cookie',
    u: 'URL', e: 'Custom Event', d: 'DOM Element', f: 'HTTP Referrer', aev: 'Auto-Event Variable', smm: 'Lookup Table',
    remm: 'RegEx Table', gas: 'Google Analytics Settings (UA, sunset)', gtes: 'Google Tag: Event Settings',
    gtcs: 'Google Tag: Configuration Settings', ctv: 'Container Version Number', r: 'Random Number', dbg: 'Debug Mode',
    vis: 'Element Visibility', uv: 'Undefined Value', awec: 'User-Provided Data', cid: 'Container ID', t: 'Environment Name'
  };
  var KNOWN_BUILTINS = ['Page URL', 'Page Hostname', 'Page Path', 'Referrer', 'Event', 'Click Element', 'Click Classes',
    'Click ID', 'Click Target', 'Click URL', 'Click Text', 'Form Element', 'Form Classes', 'Form ID', 'Form Target',
    'Form URL', 'Form Text', 'Error Message', 'Error URL', 'Error Line', 'Debug Mode', 'Container ID', 'Container Version',
    'Random Number', 'HTML ID', 'Environment Name', 'New History Fragment', 'Old History Fragment', 'New History State',
    'Old History State', 'History Source', 'Video Provider', 'Video Status', 'Video URL', 'Video Title', 'Video Duration',
    'Video Current Time', 'Video Percent', 'Video Visible', 'Scroll Depth Threshold', 'Scroll Depth Units',
    'Scroll Direction', 'Percent Visible', 'On-Screen Duration', 'Client Name', 'Event Name', 'Query String',
    'Request Method', 'Request Path', 'Request Hostname', 'Request Port'];

  var OPS = {
    equals: 'equals', contains: 'contains', startsWith: 'starts with', endsWith: 'ends with', matchRegex: 'matches RegEx',
    greater: 'greater than', greaterOrEquals: 'greater than or equal to', less: 'less than',
    lessOrEquals: 'less than or equal to', cssSelector: 'matches CSS selector'
  };

  var SEVERITIES = ['critical', 'high', 'medium', 'low', 'info'];
  var SEV_WEIGHT = { critical: 15, high: 8, medium: 3, low: 1, info: 0 };
  var CATEGORIES = ['Tracking correctness', 'Consent & privacy', 'Hygiene & cleanup', 'Security & performance'];

  var SKIP_KEYS = { name: 1, notes: 1, fingerprint: 1, path: 1, tagManagerUrl: 1, description: 1 };
  var PII_RE = /e-?mail|phone|first[\s_.-]?name|last[\s_.-]?name|full[\s_.-]?name|street|address|zip|postal|\bdob\b|birth|\bssn\b/i;
  var EMAIL_RE = /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i;
  var DEFAULT_NAME_RE = /^(untitled( (tag|trigger|variable))?|new (tag|trigger|variable)|(tag|trigger|variable)( \d+)?|custom html( \d+)?|custom image( \d+)?|google tag( \d+)?|ga4 event( \d+)?|page view( \d+)?|click( \d+)?|constant( \d+)?|copy of .*|.* copy( \d+)?|.* \(copy\))$/i;

  /* ---------- helpers ---------- */
  function str(v) { return v == null ? '' : String(v); }
  function walkStrings(obj, fn) {
    if (obj == null) return;
    if (typeof obj === 'string') { fn(obj); return; }
    if (Array.isArray(obj)) { obj.forEach(function (x) { walkStrings(x, fn); }); return; }
    if (typeof obj === 'object') {
      Object.keys(obj).forEach(function (k) { if (!SKIP_KEYS[k]) walkStrings(obj[k], fn); });
    }
  }
  function varRefs(obj) {
    var out = {};
    walkStrings(obj, function (s) {
      var re = /\{\{([^{}]+)\}\}/g, m;
      while ((m = re.exec(s))) out[m[1].trim()] = 1;
    });
    return Object.keys(out);
  }
  function getParam(params, key) {
    var p = (params || []).filter(function (x) { return x.key === key; })[0];
    return p ? p : null;
  }
  function paramVal(params, key) { var p = getParam(params, key); return p && p.value != null ? String(p.value) : ''; }
  function flatOne(p, path, out) {
    var k = p.key != null ? (path ? path + '.' + p.key : p.key) : path;
    if (p.type === 'list') {
      var l = p.list || [];
      if (!l.length) out[k || '(list)'] = '(empty list)';
      l.forEach(function (x, i) { flatOne(x, (k || '') + '[' + (i + 1) + ']', out); });
    } else if (p.type === 'map') {
      (p.map || []).forEach(function (x) { flatOne(x, k, out); });
    } else {
      out[k || '(value)'] = p.value != null ? String(p.value) : '';
    }
  }
  function flattenParams(params) { var out = {}; (params || []).forEach(function (p) { flatOne(p, '', out); }); return out; }
  function uniq(a) { var s = {}; return a.filter(function (x) { if (s[x]) return false; s[x] = 1; return true; }); }
  function domainsIn(text) {
    var out = [], re = /https?:\/\/([a-z0-9.-]+\.[a-z]{2,})/gi, m;
    while ((m = re.exec(text || ''))) out.push(m[1].toLowerCase());
    var re2 = /(?:src|href)\s*=\s*["']\/\/([a-z0-9.-]+\.[a-z]{2,})/gi;
    while ((m = re2.exec(text || ''))) out.push(m[1].toLowerCase());
    return uniq(out);
  }

  /* ---------- parse ---------- */
  function parseExport(text, fileName) {
    var j;
    try { j = JSON.parse(text); } catch (e) { throw new Error('"' + fileName + '" is not valid JSON (' + e.message + ').'); }
    var cv = j && j.containerVersion ? j.containerVersion : (j && (j.tag || j.trigger || j.variable) ? j : null);
    if (!cv) throw new Error('"' + fileName + '" does not look like a GTM container export (no "containerVersion" found).');
    var c = cv.container || {};
    return {
      fileName: fileName,
      exportTime: j.exportTime || '',
      exportFormatVersion: j.exportFormatVersion,
      container: { name: c.name || '(unnamed container)', publicId: c.publicId || '', containerId: cv.containerId || c.containerId || '', accountId: cv.accountId || c.accountId || '', usageContext: (c.usageContext || []).join(', ') },
      versionId: str(cv.containerVersionId),
      versionName: cv.name || '',
      description: cv.description || '',
      tags: cv.tag || [], triggers: cv.trigger || [], variables: cv.variable || [], folders: cv.folder || [],
      builtIns: cv.builtInVariable || [], templates: cv.customTemplate || [], clients: cv.client || [],
      raw: j
    };
  }

  /* ---------- model ---------- */
  function condText(c) {
    var p = c.parameter || [];
    var a0 = paramVal(p, 'arg0'), a1 = paramVal(p, 'arg1');
    var neg = c.negate === true || paramVal(p, 'negate') === 'true';
    var op = OPS[c.type] || c.type;
    var ic = paramVal(p, 'ignore_case') === 'true' ? ' (ignore case)' : '';
    return a0 + ' ' + (neg ? 'does not ' + op.replace(/^equals$/, 'equal').replace(/^matches/, 'match').replace(/^contains/, 'contain').replace(/^starts/, 'start').replace(/^ends/, 'end') : op) + ' ' + a1 + ic;
  }

  function buildModel(m) {
    var templatesByType = {};
    m.templates.forEach(function (t) {
      templatesByType['cvt_' + m.container.containerId + '_' + t.templateId] = t;
      templatesByType['cvt_' + t.templateId] = t;
      if (t.galleryReference && t.galleryReference.galleryTemplateId) templatesByType['cvt_' + t.galleryReference.galleryTemplateId] = t;
    });
    function tagTypeLabel(type) {
      if (TAG_TYPES[type]) return TAG_TYPES[type];
      if (templatesByType[type]) return templatesByType[type].name + ' (template)';
      if (/^cvt_/.test(type)) {
        var hit = m.templates.filter(function (t) { return type.slice(-(String(t.templateId).length + 1)) === '_' + t.templateId; })[0];
        if (hit) { templatesByType[type] = hit; return hit.name + ' (template)'; }
        return 'Custom Template (' + type + ')';
      }
      return type;
    }
    var folders = {};
    m.folders.forEach(function (f) { folders[str(f.folderId)] = f.name; });

    var tags = m.tags.map(function (t) {
      var cs = t.consentSettings || {};
      var ctypes = cs.consentType && cs.consentType.list ? cs.consentType.list.map(function (x) { return x.value; }) : [];
      return {
        kind: 'tag', id: str(t.tagId), name: t.name, type: t.type, typeLabel: tagTypeLabel(t.type),
        isGoogle: !!GOOGLE_TAGS[t.type], isTemplate: /^cvt_/.test(t.type), template: templatesByType[t.type] || null,
        paused: !!t.paused, firing: (t.firingTriggerId || []).map(str), blocking: (t.blockingTriggerId || []).map(str),
        params: t.parameter || [], flat: flattenParams(t.parameter), refs: varRefs(t),
        folderId: t.parentFolderId ? str(t.parentFolderId) : '', folder: folders[str(t.parentFolderId)] || '',
        consentStatus: cs.consentStatus || 'notSet', consentTypes: ctypes,
        firingOption: t.tagFiringOption || 'oncePerEvent',
        setup: (t.setupTag || []).map(function (s) { return s.tagName; }),
        teardown: (t.teardownTag || []).map(function (s) { return s.tagName; }),
        priority: t.priority && t.priority.value != null ? String(t.priority.value) : '',
        schedule: (t.scheduleStartMs || t.scheduleEndMs) ? 'scheduled' : '',
        notes: t.notes || '', raw: t
      };
    });
    var triggers = m.triggers.map(function (t) {
      var conds = [];
      ['customEventFilter', 'filter', 'autoEventFilter'].forEach(function (k) {
        (t[k] || []).forEach(function (c) { conds.push({ group: k, text: condText(c), raw: c }); });
      });
      var groupIds = [];
      var tg = getParam(t.parameter, 'triggerIds');
      if (tg && tg.list) groupIds = tg.list.map(function (x) { return str(x.value); });
      var other = {};
      Object.keys(t).forEach(function (k) {
        if (/^(accountId|containerId|triggerId|name|type|fingerprint|parentFolderId|filter|customEventFilter|autoEventFilter|path|tagManagerUrl|workspaceId|notes|parameter)$/.test(k)) return;
        var v = t[k];
        if (v && typeof v === 'object' && !Array.isArray(v) && 'type' in v) flatOne(Object.assign({ key: k }, v), '', other);
        else if (typeof v !== 'object') other[k] = str(v);
      });
      Object.assign(other, flattenParams((t.parameter || []).filter(function (p) { return p.key !== 'triggerIds'; })));
      var ceName = '';
      (t.customEventFilter || []).forEach(function (c) { var a = paramVal(c.parameter, 'arg0'); if (/_event/.test(a)) ceName = paramVal(c.parameter, 'arg1'); });
      return {
        kind: 'trigger', id: str(t.triggerId), name: t.name, type: t.type, typeLabel: TRIGGER_TYPES[t.type] || t.type,
        conditions: conds, groupIds: groupIds, other: other, refs: varRefs(t), eventName: ceName,
        folderId: t.parentFolderId ? str(t.parentFolderId) : '', folder: folders[str(t.parentFolderId)] || '',
        notes: t.notes || '', raw: t
      };
    });
    var variables = m.variables.map(function (v) {
      return {
        kind: 'variable', id: str(v.variableId), name: v.name, type: v.type, typeLabel: VAR_TYPES[v.type] || (/^cvt_/.test(v.type) ? tagTypeLabel(v.type) : v.type),
        params: v.parameter || [], flat: flattenParams(v.parameter), refs: varRefs(v),
        folderId: v.parentFolderId ? str(v.parentFolderId) : '', folder: folders[str(v.parentFolderId)] || '',
        notes: v.notes || '', raw: v
      };
    });

    var tagById = {}, trigById = {}, varByName = {}, tagByName = {};
    tags.forEach(function (t) { tagById[t.id] = t; tagByName[t.name] = t; });
    triggers.forEach(function (t) { trigById[t.id] = t; });
    variables.forEach(function (v) { varByName[v.name] = v; });
    var builtInNames = {};
    m.builtIns.forEach(function (b) { builtInNames[b.name] = 1; });

    // reverse references
    tags.forEach(function (t) { t.usedAsSetupBy = []; t.usedAsCleanupBy = []; });
    triggers.forEach(function (t) { t.firesTags = []; t.blocksTags = []; t.inGroups = []; });
    variables.forEach(function (v) { v.usedBy = []; });
    tags.forEach(function (t) {
      t.firing.forEach(function (id) { if (trigById[id]) trigById[id].firesTags.push(t.id); });
      t.blocking.forEach(function (id) { if (trigById[id]) trigById[id].blocksTags.push(t.id); });
      t.setup.forEach(function (n) { if (tagByName[n]) tagByName[n].usedAsSetupBy.push(t.id); });
      t.teardown.forEach(function (n) { if (tagByName[n]) tagByName[n].usedAsCleanupBy.push(t.id); });
    });
    triggers.forEach(function (t) { t.groupIds.forEach(function (id) { if (trigById[id]) trigById[id].inGroups.push(t.id); }); });
    function addUse(list, owner) {
      list.refs.forEach(function (r) { if (varByName[r] && !(owner.kind === 'variable' && owner.name === r)) varByName[r].usedBy.push({ kind: owner.kind, id: owner.id }); });
    }
    tags.forEach(function (t) { addUse(t, t); });
    triggers.forEach(function (t) { addUse(t, t); });
    variables.forEach(function (v) { addUse(v, v); });

    function triggerName(id) {
      if (BUILTIN_TRIGGERS[id]) return BUILTIN_TRIGGERS[id] + ' (built-in)';
      if (trigById[id]) return trigById[id].name;
      return 'Missing trigger (ID ' + id + ')';
    }
    function resolve(v) {
      var mm = /^\{\{(.+)\}\}$/.exec(str(v).trim());
      if (mm && varByName[mm[1]] && varByName[mm[1]].type === 'c') return paramVal(varByName[mm[1]].params, 'value');
      return str(v);
    }
    return {
      meta: m, tags: tags, triggers: triggers, variables: variables, folders: m.folders,
      tagById: tagById, trigById: trigById, varByName: varByName, tagByName: tagByName, builtInNames: builtInNames,
      triggerName: triggerName, resolve: resolve
    };
  }

  /* ---------- rules ---------- */
  function analyze(meta) {
    var M = buildModel(meta);
    var issues = [];
    function ent(e, note) { return { kind: e.kind, id: e.id, name: e.name, note: note || '' }; }
    function add(rule, severity, category, title, entities, why, fix) {
      if (entities !== null && entities.length === 0) return;
      issues.push({ rule: rule, severity: severity, category: category, title: title, entities: entities || [], containerLevel: entities === null, why: why, fix: fix });
    }
    var active = M.tags.filter(function (t) { return !t.paused; });
    function isPageviewAll(id) {
      if (id === ALL_PAGES) return true;
      var t = M.trigById[id];
      return !!(t && (t.type === 'pageview' || t.type === 'domReady' || t.type === 'windowLoaded') && t.conditions.length === 0);
    }
    var T = 'Tracking correctness', C = 'Consent & privacy', H = 'Hygiene & cleanup', S = 'Security & performance';

    // --- broken trigger references
    var broken = [];
    M.tags.forEach(function (t) {
      t.firing.concat(t.blocking).forEach(function (id) {
        if (!BUILTIN_TRIGGERS[id] && !M.trigById[id]) broken.push(ent(t, 'references trigger ID ' + id + ', which is not in this container'));
      });
    });
    add('broken-trigger-ref', 'critical', T, 'Tags point to triggers that no longer exist', broken,
      'A tag that references a deleted trigger will not fire as expected, and GTM may block publishing.',
      'In Tags, open each tag listed, go to Triggering, remove the missing trigger, and add the correct one.');

    // --- unresolved variables
    var unresolved = [], notEnabled = [];
    function checkRefs(e) {
      e.refs.forEach(function (r) {
        if (M.varByName[r] || M.builtInNames[r] || r === '_event') return;
        if (KNOWN_BUILTINS.indexOf(r) >= 0) notEnabled.push(ent(e, '{{' + r + '}} is a built-in variable that is not enabled'));
        else unresolved.push(ent(e, 'uses {{' + r + '}}, which does not exist'));
      });
    }
    M.tags.forEach(checkRefs); M.triggers.forEach(checkRefs); M.variables.forEach(checkRefs);
    add('unresolved-variable', 'critical', T, 'References to variables that do not exist', unresolved,
      'An unknown {{variable}} resolves to nothing, so the field is sent empty or the condition never matches.',
      'Create the missing variable in Variables > User-Defined Variables > New, or correct the spelling in the field shown.');
    add('builtin-not-enabled', 'high', T, 'Built-in variables used but not enabled', notEnabled,
      'Built-in variables only work when enabled. Until then the reference returns nothing.',
      'Go to Variables > Built-In Variables > Configure and tick each built-in listed.');

    // --- setup / cleanup tags missing
    var missSeq = [];
    M.tags.forEach(function (t) {
      t.setup.concat(t.teardown).forEach(function (n) { if (!M.tagByName[n]) missSeq.push(ent(t, 'tag sequencing references "' + n + '", which is not in this container')); });
    });
    add('missing-sequence-tag', 'critical', T, 'Tag sequencing points to missing tags', missSeq,
      'The setup or cleanup tag cannot run, and with "don\'t fire if setup fails" ticked the main tag will not fire either.',
      'Open the tag, go to Advanced Settings > Tag Sequencing, and pick an existing tag or remove the sequence.');

    // --- trigger groups referencing missing triggers
    var tgMiss = [];
    M.triggers.forEach(function (t) { t.groupIds.forEach(function (id) { if (!M.trigById[id] && !BUILTIN_TRIGGERS[id]) tgMiss.push(ent(t, 'includes trigger ID ' + id + ', which is not in this container')); }); });
    add('trigger-group-missing', 'critical', T, 'Trigger groups include missing triggers', tgMiss,
      'A trigger group only fires when every trigger in it has fired. A missing member means the group never fires.',
      'Open the trigger group in Triggers and replace or remove the missing trigger.');

    // --- active tags with no firing triggers
    var noTrig = active.filter(function (t) { return t.firing.length === 0 && t.usedAsSetupBy.length === 0 && t.usedAsCleanupBy.length === 0; });
    add('no-firing-trigger', 'high', T, 'Active tags with no firing trigger', noTrig.map(function (t) { return ent(t, 'has no firing trigger and is not used in tag sequencing'); }),
      'These tags never fire. Either tracking is missing or the tag is dead weight.',

        dropZone('Drag another version here', 'or click to choose a file', false) +

        (S.demo ? '<button class="btn" data-do="demo2">Load the demo comparison</button>' : '') + '</section>';
    }
    var d0 = S.diff, O = S.prev.model.meta, N = S.cur.model.meta;
    var d = Object.assign({}, d0, { newIssues: d0.newIssues.filter(function (x) { return isOn(x.issue.rule); }), resolvedIssues: d0.resolvedIssues.filter(function (x) { return isOn(x.issue.rule); }) });
    function cnt(list, kind, getter) { return list.filter(function (x) { return (getter ? getter(x) : x).kind === kind; }).length; }
    var h = '<section class="card"><div class="card-h"><div><div class="eyebrow">Comparing</div><h2>v' + esc(O.versionId) + (O.versionName ? ' "' + esc(O.versionName) + '"' : '') + ' → v' + esc(N.versionId) + (N.versionName ? ' "' + esc(N.versionName) + '"' : '') + '</h2>' +
      '<div class="muted small">Older: ' + esc(O.fileName) + ' (exported ' + esc(O.exportTime) + ') · Newer: ' + esc(N.fileName) + ' (exported ' + esc(N.exportTime) + ')</div></div>' +
      '<div class="row gap wrap"><button class="btn small" data-do="swap">Swap older/newer</button><button class="btn small" data-do="copy-diff">Copy change log</button><button class="btn small ghost" data-do="clear-cmp">Clear comparison</button></div></div>' +
      (!d.sameContainer ? '<div class="warnbox">These files are from different containers (' + esc(O.container.publicId) + ' and ' + esc(N.container.publicId) + '). Items were matched by name and type, so treat the comparison as approximate.</div>' : '') +
      '<div class="summary"><div class="eyebrow">Summary</div><p>' + esc(d.summary) + '</p><button class="btn small ghost" data-do="copy-summary">Copy summary</button></div></section>';
    h += '<section class="tiles">' + ['tag', 'trigger', 'variable'].map(function (k) {
      return '<div class="tile"><div class="tl">' + KIND_LABEL[k] + 's</div><div class="deltas"><span class="d-add">+' + cnt(d.added, k) + ' added</span><span class="d-rem">−' + cnt(d.removed, k) + ' removed</span><span class="d-chg">~' + cnt(d.changed, k, function (c) { return c.after; }) + ' edited</span></div></div>';
    }).join('') +
      '<div class="tile"><div class="tl">Health score</div><div class="tv">' + SC(S.prev).score + ' → ' + SC(S.cur).score + '</div><div class="muted">' + (SC(S.cur).score >= SC(S.prev).score ? '+' : '') + (SC(S.cur).score - SC(S.prev).score) + ' points</div></div></section>';
    function issueLines(list, empty) {
      if (!list.length) return '<p class="muted small">' + empty + '</p>';
      return '<ul class="ents">' + list.map(function (x) { return '<li>' + sevBadge(x.issue.severity) + ' ' + esc(x.issue.title) + (x.entity ? ': ' + (x.entity.kind !== 'folder' ? '<b>' + esc(x.entity.name) + '</b>' : esc(x.entity.name)) : '') + '</li>'; }).join('') + '</ul>';
    }
    h += '<section class="grid2"><div class="card"><h2>Findings fixed in v' + esc(N.versionId) + ' <span class="muted">(' + d.resolvedIssues.length + ')</span></h2>' + issueLines(d.resolvedIssues, 'None.') + '</div>' +
      '<div class="card"><h2>Findings introduced in v' + esc(N.versionId) + ' <span class="muted">(' + d.newIssues.length + ')</span></h2>' + issueLines(d.newIssues, 'None.') + '</div></section>';
    function entLine(e, newer) { return newer ? entChip(e) : '<span class="chip"><span class="k">' + KIND_LABEL[e.kind] + '</span>' + esc(e.name) + '</span>'; }
    h += '<section class="card"><h2>Added <span class="muted">(' + d.added.length + ')</span></h2>' + (d.added.length ? '<ul class="ents">' + d.added.map(function (e) { return '<li>' + entLine(e, true) + ' <span class="muted small">' + esc(e.typeLabel) + '</span></li>'; }).join('') + '</ul>' : '<p class="muted small">Nothing added.</p>') + '</section>';
    h += '<section class="card"><h2>Removed <span class="muted">(' + d.removed.length + ')</span></h2>' + (d.removed.length ? '<ul class="ents">' + d.removed.map(function (e) { return '<li>' + entLine(e, false) + ' <span class="muted small">' + esc(e.typeLabel) + '</span></li>'; }).join('') + '</ul>' : '<p class="muted small">Nothing removed.</p>') + '</section>';
    h += '<section class="card"><h2>Edited <span class="muted">(' + d.changed.length + ')</span></h2>' + (d.changed.length ? d.changed.map(function (c) {
      return '<details class="chg" open><summary>' + entChip(c.after) + ' <span class="muted small">' + plural(c.changes.length, 'field') + ' changed</span></summary><div class="tablewrap"><table class="diff"><thead><tr><th>Field</th><th>Before (v' + esc(O.versionId) + ')</th><th>After (v' + esc(N.versionId) + ')</th></tr></thead><tbody>' +
        c.changes.map(function (x) {
          if (x.lines) return '<tr><th>' + esc(x.field) + '</th><td colspan="2"><pre class="code linediff">' + x.lines.map(function (l) { return '<span class="ld ld' + (l[0] === '+' ? 'a' : l[0] === '-' ? 'r' : 'c') + '">' + esc(l[0] + ' ' + l[1]) + '</span>'; }).join('') + '</pre></td></tr>';
          return '<tr><th>' + esc(x.field) + '</th><td class="was">' + (x.from === '' ? '<span class="muted">(empty)</span>' : hl(x.from)) + '</td><td class="now">' + (x.to === '' ? '<span class="muted">(empty)</span>' : hl(x.to)) + '</td></tr>';
        }).join('') + '</tbody></table></div></details>';
    }).join('') : '<p class="muted small">Nothing edited.</p>') + '</section>';
    return h;
  }
  function diffText() {
    var d0 = S.diff, O = S.prev.model.meta, N = S.cur.model.meta, out = [];
    var d = Object.assign({}, d0, { newIssues: d0.newIssues.filter(function (x) { return isOn(x.issue.rule); }), resolvedIssues: d0.resolvedIssues.filter(function (x) { return isOn(x.issue.rule); }) });
    out.push('GTM change log: ' + N.container.name + ' (' + N.container.publicId + ')');
    out.push('Version ' + O.versionId + (O.versionName ? ' "' + O.versionName + '"' : '') + ' to ' + N.versionId + (N.versionName ? ' "' + N.versionName + '"' : ''));
    out.push(''); out.push(d.summary); out.push('');
    if (d.added.length) { out.push('ADDED'); d.added.forEach(function (e) { out.push('- ' + KIND_LABEL[e.kind] + ': ' + e.name + ' (' + e.typeLabel + ')'); }); out.push(''); }
    if (d.removed.length) { out.push('REMOVED'); d.removed.forEach(function (e) { out.push('- ' + KIND_LABEL[e.kind] + ': ' + e.name + ' (' + e.typeLabel + ')'); }); out.push(''); }
    if (d.changed.length) {
      out.push('EDITED');
      d.changed.forEach(function (c) {
        out.push('- ' + KIND_LABEL[c.after.kind] + ': ' + c.after.name);
        c.changes.forEach(function (x) { out.push('    ' + x.field + ': ' + (x.lines ? '(multi-line change, see dashboard)' : '"' + x.from + '" -> "' + x.to + '"')); });
      });
      out.push('');
    }
    if (d.resolvedIssues.length) { out.push('FINDINGS FIXED'); d.resolvedIssues.forEach(function (x) { out.push('✅ ' + x.issue.title + (x.entity ? ': ' + x.entity.name : '')); }); out.push(''); }
    if (d.newIssues.length) { out.push('FINDINGS INTRODUCED'); d.newIssues.forEach(function (x) { out.push('⬜ [' + SEV_LABEL[x.issue.severity].toUpperCase() + '] ' + x.issue.title + (x.entity ? ': ' + x.entity.name : '')); }); }
    return out.join('\n');
  }

  /* ---------- help ---------- */

  /* ---------- Drive library ---------- */
  // After deploying the Apps Script library service, paste its Web app URL here so teammates only need the access key.
  var LIBRARY_SERVICE_URL = '';
  S.lib = { status: 'idle', data: null, error: '', q: '', open: {}, sel: {}, progress: '', settings: false };
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) { } }
  function libCfg() { return { url: lsGet('gtm-lib-url') || LIBRARY_SERVICE_URL, key: lsGet('gtm-lib-key') }; }
  function libCall(params) {
    var cfg = libCfg();
    var qs = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
    return fetch(cfg.url + (cfg.url.indexOf('?') >= 0 ? '&' : '?') + 'key=' + encodeURIComponent(cfg.key) + '&' + qs, { redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('Library service returned HTTP ' + r.status + '.'); return r.json(); },
        function () { throw new Error('Could not reach the library service. Check the service URL, and that the Apps Script deployment is set to Execute as: Me, Who has access: Anyone.'); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || 'Library service error.'); return j; });
  }
  function libLoad(rebuild) {
    S.lib.status = 'loading'; S.lib.error = ''; S.lib.progress = 'Reading the library folder…';
    if (S.tab === 'library') render();
    var rounds = 0;
    (function step(first) {
      libCall({ action: 'library', rebuild: first && rebuild ? '1' : '0' }).then(function (j) {
        S.lib.data = j;
        if (j.partial && ++rounds < 15) { S.lib.progress = 'Indexing… ' + j.indexed + ' files so far (large libraries take a few rounds the first time).'; if (S.tab === 'library') render(); step(false); return; }
        S.lib.status = 'ready'; if (S.tab === 'library') render();
      }).catch(function (e) { S.lib.status = 'error'; S.lib.error = e.message; if (S.tab === 'library') render(); });
    })(true);
  }
  function libGroups() {
    var d = S.lib.data; if (!d) return { groups: [], other: [] };
    var groups = {}, other = [];
    d.files.forEach(function (f) {
      var m = f.meta || {};
      if (m.error) { other.push(f); return; }
      var key = m.containerId ? 'c' + m.accountId + '/' + m.containerId : m.publicId ? 'p' + m.publicId : 'f' + f.folderPath;
      var g = groups[key] = groups[key] || { key: key, versions: [], folders: {} };
      g.versions.push(f); g.folders[f.folderPath || '(top level)'] = 1;
    });
    var list = Object.keys(groups).map(function (k) {
      var g = groups[k];
      g.versions.sort(function (a, b) { return (Number(b.meta.versionId) || 0) - (Number(a.meta.versionId) || 0) || b.updated - a.updated; });
      var latest = g.versions[0].meta, named = g.versions.filter(function (v) { return v.meta.containerName; })[0];
      g.name = named ? named.meta.containerName : Object.keys(g.folders)[0];
      g.publicId = latest.publicId || (g.versions.filter(function (v) { return v.meta.publicId; })[0] || { meta: {} }).meta.publicId || '';
      g.accountId = latest.accountId; g.containerId = latest.containerId;
      g.latest = g.versions[0];
      return g;
    }).sort(function (a, b) { return a.name.localeCompare(b.name); });
    return { groups: list, other: other };
  }
  function verDate(f) {
    var m = f.meta;
    if (m.exportTime) return m.exportTime.slice(0, 16);
    var d = new Date(m.modifiedTime || f.updated);
    return isNaN(d) ? '' : d.toLocaleString([], { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function viewLibrary() {
    var cfg = libCfg();
    if (!cfg.url || !cfg.key || S.lib.settings) {
      return '<section class="card narrow"><h2>Connect to the Drive library</h2><p class="muted">The library service reads the GTM container version JSONs in the Platform Solutions Drive folder. Ask Brian for the access key.</p>' +
        '<form id="libForm" class="libform"><label>Library service URL<input type="url" name="url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(cfg.url) + '" required></label>' +
        '<label>Access key<input type="password" name="key" autocomplete="off" value="' + esc(cfg.key) + '" required></label>' +
        '<div class="row gap wrap"><button class="btn primary" type="submit">Save and connect</button>' + (cfg.key ? '<button class="btn ghost" type="button" data-do="lib-forget">Forget key on this computer</button>' : '') + (S.lib.settings && cfg.url && cfg.key ? '<button class="btn ghost" type="button" data-do="lib-settings">Cancel</button>' : '') + '</div></form>' +
        '<p class="muted small">The URL and key are saved in this browser only. Container files are fetched straight from the library into this page; nothing is uploaded anywhere else.</p></section>';
    }
    if (S.lib.status === 'idle') setTimeout(function () { libLoad(false); }, 0);
    var d = S.lib.data, g = libGroups(), nVer = g.groups.reduce(function (s, x) { return s + x.versions.length; }, 0);
    var h = '<section class="card"><div class="card-h"><div><h2>Drive library' + (d ? ': ' + esc(d.folderName) : '') + '</h2><div class="muted small">' +
      (d ? plural(g.groups.length, 'container') + ' · ' + plural(nVer, 'version') + (g.other.length ? ' · ' + plural(g.other.length, 'other file') : '') + ' · indexed ' + esc(new Date(d.updated).toLocaleString()) : 'Not loaded yet') + '</div></div>' +
      '<div class="row gap wrap"><button class="btn small" data-do="lib-refresh">Refresh</button><button class="btn small ghost" data-do="lib-rebuild" title="Re-read every file (slower)">Rebuild index</button><button class="btn small ghost" data-do="lib-settings">Connection settings</button></div></div>';
    if (S.lib.status === 'loading') h += '<div class="libstatus"><span class="spinner" aria-hidden="true"></span>' + esc(S.lib.progress) + '</div>';
    if (S.lib.status === 'error') h += '<div class="warnbox"><b>Could not load the library.</b> ' + esc(S.lib.error) + '</div>';
    h += '<div class="row gap wrap"><input type="search" placeholder="Search container name, public ID, account or version name" data-bind="lib.q" value="' + esc(S.lib.q) + '" aria-label="Search library" style="width:420px"></div></section><section id="libList"></section>';
    return h;
  }
  function renderLibList() {
    var el = $('#libList'); if (!el) return;
    if (!S.lib.data) { el.innerHTML = ''; return; }
    var g = libGroups(), q = S.lib.q.toLowerCase();
    var groups = g.groups.filter(function (x) {
      if (!q) return true;
      return (x.name + ' ' + x.publicId + ' ' + x.accountId + ' ' + x.containerId + ' ' + Object.keys(x.folders).join(' ') + ' ' + x.versions.map(function (v) { return v.meta.versionName + ' ' + v.name; }).join(' ')).toLowerCase().indexOf(q) >= 0;
    });
    var h = '<div class="card"><div class="tablewrap"><table class="lib"><thead><tr><th>Container name</th><th>Public ID</th><th>Account</th><th class="num">Versions</th><th>Latest version</th><th>Latest date</th><th></th></tr></thead><tbody>';
    if (!groups.length) h += '<tr><td colspan="7" class="muted">' + (q ? 'No containers match this search.' : 'No GTM version JSONs found in the folder yet.') + '</td></tr>';
    groups.forEach(function (x) {
      var open = !!S.lib.open[x.key], L = x.latest.meta;
      h += '<tr class="grow' + (open ? ' open' : '') + '"><td><button class="linkbtn b" data-do="lib-toggle" data-key="' + esc(x.key) + '" aria-expanded="' + open + '">' + (open ? '▾ ' : '▸ ') + esc(x.name) + '</button>' + (Object.keys(x.folders)[0] !== x.name ? '<div class="muted tiny">Folder: ' + esc(Object.keys(x.folders).join(', ')) + '</div>' : '') + '</td>' +
        '<td class="mono">' + esc(x.publicId || '-') + '</td><td class="mono">' + esc(x.accountId || '-') + '</td><td class="num">' + x.versions.length + '</td>' +
        '<td>v' + esc(L.versionId || '?') + (L.versionName ? ' <span class="muted">' + esc(L.versionName) + '</span>' : '') + '</td><td class="small">' + esc(verDate(x.latest)) + '</td>' +
        '<td class="acts"><button class="btn small" data-do="lib-open" data-ids="' + esc(x.latest.id) + '">Audit latest</button>' + (x.versions.length > 1 ? '<button class="btn small" data-do="lib-open" data-ids="' + esc(x.versions[1].id + ',' + x.latest.id) + '">Compare latest 2</button>' : '') + '</td></tr>';
      if (open) {
        var sel = S.lib.sel[x.key] || {}, nSel = Object.keys(sel).length;
        h += '<tr class="vrow"><td colspan="7"><div class="vbox"><div class="row gap wrap vbar"><span class="muted small">Tick two versions to compare them.</span><button class="btn small primary" data-do="lib-cmp" data-key="' + esc(x.key) + '"' + (nSel === 2 ? '' : ' disabled') + '>Compare selected (' + nSel + '/2)</button></div>' +
          '<table class="vers"><thead><tr><th></th><th>Version</th><th>Version name</th><th>Date</th><th class="num">Tags</th><th class="num">Triggers</th><th class="num">Variables</th><th>File</th><th></th></tr></thead><tbody>' +
          x.versions.map(function (v) {
            var m = v.meta;
            return '<tr><td><input type="checkbox" data-libsel="' + esc(x.key) + '" value="' + esc(v.id) + '"' + (sel[v.id] ? ' checked' : '') + ' aria-label="Select version ' + esc(m.versionId) + '"></td><td class="b">v' + esc(m.versionId || '?') + (m.deleted ? ' <span class="pill warn">deleted</span>' : '') + '</td><td>' + esc(m.versionName || '') + (m.description ? '<div class="muted tiny">' + esc(m.description) + '</div>' : '') + '</td><td class="small">' + esc(verDate(v)) + '</td>' +
              '<td class="num">' + m.tags + '</td><td class="num">' + m.triggers + '</td><td class="num">' + m.variables + '</td><td class="muted small">' + esc(v.name) + '</td><td><button class="btn small" data-do="lib-open" data-ids="' + esc(v.id) + '">Audit</button></td></tr>';
          }).join('') + '</tbody></table></div></td></tr>';
      }
    });
    h += '</tbody></table></div></div>';
    if (g.other.length) h += '<details class="card outscope"><summary>' + plural(g.other.length, 'other JSON file') + (g.other.length === 1 ? ' that is' : ' that are') + ' not a GTM container version</summary><ul class="plain small">' + g.other.map(function (f) { return '<li>' + esc((f.folderPath ? f.folderPath + ' / ' : '') + f.name) + ' <span class="muted">(' + esc(f.meta.error) + ')</span></li>'; }).join('') + '</ul></details>';
    el.innerHTML = h;
  }
  function libOpen(ids) {
    toast('Opening from the Drive library…');
    Promise.all(ids.map(function (id) { return libCall({ action: 'file', id: id }); }))
      .then(function (res) {
        var metas = res.map(function (r) { return C.parseExport(r.content, r.name); });
        S.demo = false;
        if (metas.length === 2) setVersions(metas[0], metas[1]); else setVersions(metas[0]);
      })
      .catch(function (e) { toast(e.message, true); });
  }
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'libForm') return;
    e.preventDefault();
    var f = e.target;
    lsSet('gtm-lib-url', f.url.value.trim() === LIBRARY_SERVICE_URL ? '' : f.url.value.trim());
    lsSet('gtm-lib-key', f.key.value.trim());
    S.lib.settings = false; S.lib.status = 'idle'; S.lib.data = null;
    render();
  });
  document.addEventListener('change', function (e) {
    var key = e.target.getAttribute && e.target.getAttribute('data-libsel'); if (!key) return;
    var sel = S.lib.sel[key] = S.lib.sel[key] || {};
    if (e.target.checked) { if (Object.keys(sel).length >= 2) { e.target.checked = false; toast('Pick two versions at most.', true); return; } sel[e.target.value] = 1; }
    else delete sel[e.target.value];
    renderLibList();
  });

  function viewHelp() {
    return '<section class="card narrow"><h2>How to export a container from GTM</h2><ol class="steps">' +
      '<li>Open the container in Google Tag Manager.</li>' +
      '<li>Go to <b>Admin</b>, then under <b>Container</b> click <b>Export Container</b>.</li>' +
      '<li>Under <b>Choose a version or workspace</b>, pick the version to audit. The <b>Live</b> version is usually the right one; pick a workspace to audit changes that are not yet published.</li>' +
      '<li>Click <b>Export</b>. A <span class="mono">.json</span> file downloads.</li>' +
      '<li>Drag the file onto this page (or click the drop area and choose it).</li></ol>' +
      '<h3>To compare two versions</h3><ol class="steps"><li>Export the two versions you want to compare (for example the Live version and the one before it). In Export Container, the version picker lists every saved version.</li><li>Drop both files at once. The higher version number is treated as the newer one; use <b>Swap older/newer</b> if needed.</li></ol>' +
      '<h3>What the audit checks</h3><ul class="plain">' +
      '<li><b>Tracking correctness:</b> missing or deleted triggers and variables, tags with no trigger, tags blocked by their own trigger, empty GA4 event names, missing Google Ads / Floodlight IDs, Conversion Linker, duplicate tags, conversions on every page or set to Unlimited, sunset UA/Optimize tags.</li>' +
      '<li><b>Consent & privacy:</b> Consent Mode defaults or a CMP tag, non-Google tags with no consent setting, possible personal data (email, phone, name, address) passed to tags.</li>' +
      '<li><b>Hygiene & cleanup:</b> paused tags, unused triggers and variables, default names, empty folders.</li>' +
      '<li><b>Security & performance:</b> http:// resources, document.write, eval(), Custom JavaScript variables with no return, Custom HTML on every page, third-party domains.</li></ul>' +
      '<p class="muted small">Findings come from fixed rules applied to the export. They show what the configuration says, not what fires on the live site, so confirm fixes in GTM Preview mode. The health score is a guide weighted by severity, not a grade.</p>' +
      '<h3>Open from the Drive library</h3><p>The <b>Drive library</b> tab lists every container in the Platform Solutions GTM library folder by container name and public ID, with each saved version. Click <b>Audit latest</b>, <b>Compare latest 2</b>, or open a container to pick any version or tick two to compare. The first time, enter the library service URL and the access key (ask Brian).</p>' +
      '<h3>Share what you see</h3><p><b>Download report</b> (top right) saves one .html file with the tool, the loaded export(s), your audit scope and the current tab. Anyone can double-click it to see the same view, no upload needed. It contains the container configuration, so share it the way you would any client file. <b>Copy link with this scope</b> shares only the checks, not the data.</p>' +
      '<h3>Privacy</h3><p>The file is read in your browser only. Nothing is uploaded, stored or sent anywhere, and refreshing the page clears it.</p>' +
      (S.cur ? '' : '<div class="row gap"><button class="btn" data-do="demo">Try a demo container</button></div>') + '</section>';
  }

  /* ---------- boot ---------- */
  var h0 = location.hash.slice(1);
  if (TABS.indexOf(h0) >= 0) S.tab = h0;
  if (!loadEmbedded()) render();
})();
